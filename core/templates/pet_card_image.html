<div style="height: 200px; overflow: hidden;" class="bg-secondary-subtle d-flex align-items-center justify-content-center">
  {% if post.image %}
  <img src="{{ post.image.url }}" style="width: 100%; height: 100%; object-fit: cover;" class="card-img-top" alt="{{ post.title }}">
  {% else %}
  <span class="text-muted">No photo</span>
  {% endif %}
</div>
